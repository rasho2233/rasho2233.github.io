<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rasho Tech Sales Manager</title>
<style>
:root{--navy:#101b35;--blue:#4567f5;--cyan:#21c6b7;--ink:#18243b;--muted:#7a859a;--bg:#f4f7fb;--line:#e7ecf4;--white:#fff;--shadow:0 12px 32px #18243b0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{background:var(--navy);color:#dbe3f7;padding:24px 16px;display:flex;flex-direction:column;gap:28px}.brand{display:flex;gap:12px;align-items:center;padding:0 8px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;color:white;font-weight:900;font-size:18px}.brand strong{font-size:16px;color:white;display:block}.brand small{color:#9caaca}.nav-label{font-size:10px;letter-spacing:1.6px;color:#7f8eae;padding:0 12px;margin-bottom:8px}.nav{display:grid;gap:5px}.nav button{border:0;color:#aebbd6;background:transparent;text-align:left;padding:12px;border-radius:11px;display:flex;align-items:center;gap:12px}.nav button span{width:20px;text-align:center;font-size:17px}.nav button.active,.nav button:hover{background:#253453;color:white}.sidebar-foot{margin-top:auto;border:1px solid #2c3a58;background:#1b2946;padding:14px;border-radius:14px;font-size:12px;color:#aebbd6}.online{color:#68e0be;font-size:11px}.main{min-width:0}.topbar{height:78px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:16px}.crumb{color:var(--muted);font-size:12px}.topbar h2{font-size:19px;margin:2px 0 0}.right{display:flex;align-items:center;gap:16px}.date{color:var(--muted);font-size:12px}.avatar{height:38px;width:38px;border-radius:50%;display:grid;place-items:center;background:#e6eaff;color:var(--blue);font-weight:800}.content{padding:28px 34px;max-width:1500px;margin:auto}.welcome{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:25px}.welcome h1{margin:0 0 5px;font-size:26px;letter-spacing:-.7px}.welcome p{margin:0;color:var(--muted)}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;background:var(--blue);color:white;box-shadow:0 6px 16px #4567f52b}.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.small{padding:8px 11px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:20px}.stat-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:#edf1ff;color:var(--blue);font-size:18px}.stat h3{font-size:25px;margin:13px 0 5px;letter-spacing:-.5px}.hint{font-size:11px;color:#159b7a}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.85fr);gap:18px}.panel{padding:21px;margin-bottom:18px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.panel h3{margin:0;font-size:15px}.muted{color:var(--muted)}.bars{height:190px;display:flex;align-items:end;justify-content:space-around;gap:13px;border-bottom:1px solid var(--line);padding:10px 5px 0}.bar-col{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:8px;flex:1}.bar{width:min(35px,75%);border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,#6c83ff,#4567f5);min-height:5px}.bar-label{font-size:10px;color:var(--muted);padding-bottom:9px}.activity{display:grid;gap:0}.activity-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #f0f2f7}.activity-row:last-child{border-bottom:0}.activity-icon{width:38px;height:38px;border-radius:12px;background:#eefbf7;color:#0e9f7e;display:grid;place-items:center}.activity-row strong{display:block;font-size:12px}.activity-row small{color:var(--muted);font-size:11px}.activity-row .amount{margin-left:auto;font-weight:800;font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px;padding:12px 10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #f0f2f7;font-size:12px}tbody tr:last-child td{border-bottom:0}.pill{padding:4px 8px;border-radius:20px;background:#eafaf4;color:#168c69;font-size:10px;font-weight:700}.empty{padding:28px;text-align:center;color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px}.section-title h1{font-size:23px;margin:0}.search{padding:10px 12px;border:1px solid var(--line);border-radius:10px;min-width:190px;outline-color:var(--blue)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field label{font-size:11px;color:var(--muted);font-weight:700}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;outline-color:var(--blue);background:white}.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:17px}.hidden{display:none!important}.notice{border:1px solid #d8eee7;background:#f0fbf7;color:#16785f;padding:12px 14px;border-radius:10px;margin-bottom:16px;font-size:12px}.footer{color:#9aa4b5;text-align:center;font-size:11px;padding:14px}.menu-toggle{display:none;border:0;background:transparent;font-size:23px}@media(max-width:1050px){.app{grid-template-columns:205px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.content{padding:23px}.topbar{padding:0 23px}}@media(max-width:760px){.app{display:block}.sidebar{display:none;position:fixed;z-index:5;inset:0 auto 0 0;width:250px;box-shadow:0 0 0 999px #101b3570}.sidebar.open{display:flex}.menu-toggle{display:block}.topbar{height:68px;padding:0 16px}.date{display:none}.content{padding:20px 14px}.welcome{align-items:stretch;flex-direction:column}.welcome h1{font-size:23px}.stats{gap:10px}.stat{padding:14px}.stat h3{font-size:21px}.stat-icon{width:31px;height:31px}.layout{grid-template-columns:1fr}.section-title{align-items:flex-start;flex-direction:column}.search{width:100%}.form-grid{grid-template-columns:1fr}.right{gap:9px}}
</style></head>
<body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">R</div><div><strong>Rasho Tech</strong><small>Sales Manager</small></div></div><div><div class="nav-label">WORKSPACE</div><nav class="nav" id="nav"><button class="active" data-page="Dashboard"><span>▦</span>Dashboard</button><button data-page="Sales"><span>↗</span>Sales</button><button data-page="Products"><span>◇</span>Products</button><button data-page="Stock"><span>▤</span>Stock</button><button data-page="Customers"><span>♙</span>Customers</button><button data-page="Expenses"><span>↘</span>Expenses</button><button data-page="Reports"><span>▥</span>Reports</button></nav></div><div class="sidebar-foot"><div class="online">● Local workspace active</div><p style="margin:8px 0 0">Your entries are saved in this browser on this device.</p></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="menu-toggle" id="menuToggle" aria-label="Open menu">☰</button><div><div class="crumb">RASHO TECH / WORKSPACE</div><h2 id="topTitle">Dashboard</h2></div></div><div class="right"><div class="date" id="today"></div><div class="avatar">RT</div></div></header><div class="content" id="content"></div><div class="footer">Rasho Tech Sales Manager · Modern workspace preview</div></main></div>
<dialog id="modal" style="border:0;border-radius:16px;padding:24px;width:min(520px,calc(100% - 28px));box-shadow:0 20px 70px #101b3540"><div class="panel-head"><h3 id="modalTitle">Add record</h3><button class="btn secondary small" id="closeModal">Close</button></div><div id="modalBody"></div></dialog>
<script>
const $=s=>document.querySelector(s); const fmt=n=>'KSh '+Number(n||0).toLocaleString('en-KE',{maximumFractionDigits:2});
const keys={Sales:'rasho_sales_v1',Products:'rasho_products_v1',Customers:'rasho_customers_v1',Expenses:'rasho_expenses_v1'};
const load=k=>{try{return JSON.parse(localStorage.getItem(keys[k])||'[]')}catch{return []}};const save=(k,v)=>localStorage.setItem(keys[k],JSON.stringify(v));
let page='Dashboard';$('#today').textContent=new Date().toLocaleDateString('en-KE',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
function allSales(){return load('Sales')}function productRows(){return load('Products')}function customerRows(){return load('Customers')}function expenses(){return load('Expenses')}
function shell(title,subtitle,button=''){return `<div class="section-title"><div><h1>${title}</h1><div class="muted" style="margin-top:5px">${subtitle}</div></div>${button}</div>`}
function dashboard(){let sales=allSales(),products=productRows(),customers=customerRows(),ex=expenses(),revenue=sales.reduce((a,x)=>a+Number(x.total||0),0),cost=ex.reduce((a,x)=>a+Number(x.amount||0),0),stock=products.reduce((a,x)=>a+Number(x.stock||0),0);let months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];let now=new Date();let values=months.map((m,i)=>sales.filter(s=>{let d=new Date(s.date);return d.getMonth()===i&&d.getFullYear()===now.getFullYear()}).reduce((a,s)=>a+Number(s.total||0),0));let max=Math.max(1,...values);let recent=[...sales].reverse().slice(0,5);return `<div class="welcome"><div><h1>Good day 👋</h1><p>Here’s what’s happening with your business today.</p></div><button class="btn" onclick="openForm('Sales')">＋ Record a sale</button></div><div class="stats"><div class="stat"><div class="stat-head">Total sales <span class="stat-icon">↗</span></div><h3>${fmt(revenue)}</h3><div class="hint">${sales.length} sale record(s)</div></div><div class="stat"><div class="stat-head">Products <span class="stat-icon">◇</span></div><h3>${products.length}</h3><div class="muted" style="font-size:11px">${stock} units in stock</div></div><div class="stat"><div class="stat-head">Customers <span class="stat-icon">♙</span></div><h3>${customers.length}</h3><div class="muted" style="font-size:11px">Saved customer records</div></div><div class="stat"><div class="stat-head">Expenses <span class="stat-icon">↘</span></div><h3>${fmt(cost)}</h3><div class="muted" style="font-size:11px">Recorded expenses</div></div></div><div class="layout"><div><section class="panel"><div class="panel-head"><div><h3>Sales overview</h3><div class="muted" style="font-size:11px;margin-top:4px">Monthly sales · ${now.getFullYear()}</div></div><span class="pill">${sales.length} records</span></div><div class="bars">${months.map((m,i)=>`<div class="bar-col" title="${m}: ${fmt(values[i])}"><div class="bar" style="height:${Math.max(3,values[i]/max*78)}%"></div><div class="bar-label">${m}</div></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><h3>Recent sales</h3><button class="btn secondary small" onclick="go('Sales')">View all</button></div>${recent.length?`<div class="table-wrap"><table><thead><tr><th>Item</th><th>Customer</th><th>Date</th><th>Total</th></tr></thead><tbody>${recent.map(s=>`<tr><td><b>${esc(s.product)}</b></td><td>${esc(s.customer||'Walk-in')}</td><td>${esc(s.date||'')}</td><td><b>${fmt(s.total)}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No sales yet. Use “Record a sale” to add your first sale.</div>'}</section></div><div><section class="panel"><div class="panel-head"><h3>Quick actions</h3></div><div class="activity"><div class="activity-row"><div class="activity-icon">＋</div><div><strong>Add product</strong><small>Register an item and price</small></div><button class="btn secondary small" onclick="openForm('Products')">Add</button></div><div class="activity-row"><div class="activity-icon">♙</div><div><strong>Add customer</strong><small>Save customer details</small></div><button class="btn secondary small" onclick="openForm('Customers')">Add</button></div><div class="activity-row"><div class="activity-icon">↘</div><div><strong>Record expense</strong><small>Track business costs</small></div><button class="btn secondary small" onclick="openForm('Expenses')">Add</button></div></div></section><section class="panel"><div class="panel-head"><h3>Stock alerts</h3><button class="btn secondary small" onclick="go('Stock')">View</button></div>${products.filter(p=>Number(p.stock||0)<=5).length?products.filter(p=>Number(p.stock||0)<=5).slice(0,5).map(p=>`<div class="activity-row"><div class="activity-icon" style="background:#fff4e8;color:#c27b21">!</div><div><strong>${esc(p.name)}</strong><small>Low stock · ${Number(p.stock||0)} left</small></div></div>`).join(''):'<div class="empty">No low-stock products. Add products to monitor inventory.</div>'}</section></div></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const configs={Sales:{button:'＋ Record sale',fields:[['product','Product name','text',true],['customer','Customer','text',false],['quantity','Quantity','number',true],['unitPrice','Unit price (KSh)','number',true],['date','Date','date',true]],subtitle:'Track sales and revenue'},Products:{button:'＋ Add product',fields:[['name','Product name','text',true],['sku','SKU / Code','text',false],['price','Selling price (KSh)','number',true],['stock','Opening stock (units)','number',true]],subtitle:'Manage your product catalogue'},Customers:{button:'＋ Add customer',fields:[['name','Customer name','text',true],['phone','Phone number','tel',false],['email','Email address','email',false]],subtitle:'Keep customer details in one place'},Expenses:{button:'＋ Record expense',fields:[['title','Expense description','text',true],['category','Category','text',true],['amount','Amount (KSh)','number',true],['date','Date','date',true]],subtitle:'Track operating costs'}};
function openForm(type){let cfg=configs[type];if(!cfg)return;$('#modalTitle').textContent=cfg.button.replace('＋ ','');$('#modalBody').innerHTML=`<form id="recordForm"><div class="form-grid">${cfg.fields.map(f=>`<div class="field"><label>${f[1]}</label><input name="${f[0]}" type="${f[2]}" ${f[3]?'required':''} ${f[2]==='number'?'min="0" step="any"':''} ${f[2]==='date'?`value="${new Date().toISOString().slice(0,10)}"`:''}></div>`).join('')}</div><div class="form-actions"><button type="button" class="btn secondary" onclick="$('#modal').close()">Cancel</button><button class="btn" type="submit">Save record</button></div></form>`;$('#recordForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());if(type==='Sales'){d.quantity=Number(d.quantity);d.unitPrice=Number(d.unitPrice);d.total=d.quantity*d.unitPrice;let prod=productRows().find(p=>p.name.toLowerCase()===d.product.toLowerCase());if(prod){prod.stock=Math.max(0,Number(prod.stock)-d.quantity);save('Products',productRows().map(p=>p.name===prod.name?prod:p))}}if(type==='Products'){d.price=Number(d.price);d.stock=Number(d.stock)}if(type==='Expenses')d.amount=Number(d.amount);let arr=load(type);arr.push({...d,id:Date.now()});save(type,arr);$('#modal').close();render();};$('#modal').showModal()}
function tablePage(type){let arr=load(type),cfg=configs[type],fields=type==='Sales'?[['product','Product'],['customer','Customer'],['quantity','Qty'],['date','Date'],['total','Total']]:type==='Products'?[['name','Product'],['sku','SKU'],['price','Price'],['stock','Stock']]:type==='Customers'?[['name','Name'],['phone','Phone'],['email','Email']]:[['title','Description'],['category','Category'],['date','Date'],['amount','Amount']];return `${shell(type,cfg.subtitle,`<button class="btn" onclick="openForm('${type}')">${cfg.button}</button>`)}<section class="panel"><div class="panel-head"><h3>${type} records <span class="muted">(${arr.length})</span></h3><input class="search" id="search" placeholder="Search ${type.toLowerCase()}…"></div><div class="table-wrap"><table><thead><tr>${fields.map(f=>`<th>${f[1]}</th>`).join('')}<th>Action</th></tr></thead><tbody id="rows">${renderRows(type,arr,fields)}</tbody></table></div></section>`}
function renderRows(type,arr,fields){if(!arr.length)return `<tr><td colspan="${fields.length+1}" class="empty">No records yet. Click the button above to add one.</td></tr>`;return arr.slice().reverse().map(item=>`<tr>${fields.map(([k])=>`<td>${k==='total'||k==='price'||k==='amount'?fmt(item[k]):esc(item[k]||'—')}</td>`).join('')}<td><button class="btn secondary small" onclick="removeRecord('${type}',${item.id})">Delete</button></td></tr>`).join('')}
function removeRecord(type,id){if(!confirm('Delete this record?'))return;save(type,load(type).filter(x=>x.id!==id));render()}
function stockPage(){let products=productRows();return `${shell('Stock','Monitor quantities and low-stock items',`<button class="btn" onclick="openForm('Products')">＋ Add product</button>`)}<section class="panel"><div class="panel-head"><h3>Inventory levels</h3><span class="pill">${products.reduce((a,p)=>a+Number(p.stock||0),0)} units</span></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Unit price</th><th>Units available</th><th>Status</th></tr></thead><tbody>${products.length?products.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.sku||'—')}</td><td>${fmt(p.price)}</td><td>${p.stock}</td><td><span class="pill" style="${p.stock<=5?'background:#fff1e7;color:#b96b16':''}">${p.stock<=5?'Low stock':'In stock'}</span></td></tr>`).join(''):`<tr><td colspan="5" class="empty">No products added yet.</td></tr>`}</tbody></table></div></section>`}
function reports(){let s=allSales(),e=expenses(),rev=s.reduce((a,x)=>a+Number(x.total||0),0),cost=e.reduce((a,x)=>a+Number(x.amount||0),0);return `${shell('Reports','A quick summary of your business activity',`<button class="btn secondary" onclick="exportCSV()">⇩ Export sales CSV</button>`)}<div class="stats"><div class="stat"><div class="stat-head">Sales revenue<span class="stat-icon">↗</span></div><h3>${fmt(rev)}</h3><div class="muted">${s.length} transactions</div></div><div class="stat"><div class="stat-head">Expenses<span class="stat-icon">↘</span></div><h3>${fmt(cost)}</h3><div class="muted">${e.length} expense records</div></div><div class="stat"><div class="stat-head">Difference<span class="stat-icon">＝</span></div><h3>${fmt(rev-cost)}</h3><div class="muted">Revenue minus recorded expenses</div></div><div class="stat"><div class="stat-head">Products<span class="stat-icon">◇</span></div><h3>${productRows().length}</h3><div class="muted">In product catalogue</div></div></div><section class="panel"><h3>Important note</h3><p class="muted">These totals are calculated from records saved in this browser. They are not connected to Supabase or shared with other devices in this preview.</p></section>`}
function exportCSV(){let s=allSales(),rows=[['Product','Customer','Quantity','Unit price','Total','Date'],...s.map(x=>[x.product,x.customer,x.quantity,x.unitPrice,x.total,x.date])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='rasho-tech-sales.csv';a.click();URL.revokeObjectURL(a.href)}
function render(){let c=$('#content');$('#topTitle').textContent=page;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='Dashboard')c.innerHTML=dashboard();else if(page==='Stock')c.innerHTML=stockPage();else if(page==='Reports')c.innerHTML=reports();else c.innerHTML=tablePage(page);let search=$('#search');if(search)search.oninput=()=>{let q=search.value.toLowerCase();let arr=load(page),fields=page==='Sales'?[['product'],['customer'],['date']]:page==='Products'?[['name'],['sku']]:page==='Customers'?[['name'],['phone'],['email']]:[['title'],['category'],['date']];$('#rows').innerHTML=renderRows(page,arr.filter(x=>fields.some(([k])=>String(x[k]||'').toLowerCase().includes(q))),page==='Sales'?[['product','Product'],['customer','Customer'],['quantity','Qty'],['date','Date'],['total','Total']]:page==='Products'?[['name','Product'],['sku','SKU'],['price','Price'],['stock','Stock']]:page==='Customers'?[['name','Name'],['phone','Phone'],['email','Email']]:[['title','Description'],['category','Category'],['date','Date'],['amount','Amount']])};$('#sidebar').classList.remove('open')}
function go(p){page=p;render()}$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});$('#menuToggle').onclick=()=>$('#sidebar').classList.toggle('open');$('#closeModal').onclick=()=>$('#modal').close();render();
</script></body></html>
