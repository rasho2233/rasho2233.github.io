<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rasho Tech Sales Manager</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --navy:#101b35; --blue:#4567f5; --cyan:#21c6b7; --ink:#18243b; --muted:#7a859a;
      --bg:#f4f7fb; --line:#e7ecf4; --white:#fff; --shadow:0 12px 32px rgba(24,36,59,0.08);
      --danger:#d9534f; --success:#1dbf73; --chip:#eef3ff;
    }
    * { box-sizing: border-box; }
    html, body { margin:0; font:14px/1.5 Inter, Segoe UI, Arial, sans-serif; background:var(--bg); color:var(--ink); }
    body { min-height:100vh; }
    button, input, select { font:inherit; }
    .app { min-height:100vh; display:grid; grid-template-columns: 245px 1fr; }
    .sidebar { background:var(--navy); color:#dbe3f7; padding:24px 16px; display:flex; flex-direction:column; gap:24px; }
    .brand { display:flex; align-items:center; gap:12px; padding:0 8px; }
    .logo { width:42px; height:42px; border-radius:14px; display:grid; place-items:center; color:white; font-weight:900; font-size:18px; background:linear-gradient(135deg, var(--blue), var(--cyan)); }
    .brand strong { display:block; color:white; font-size:16px; }
    .brand small { color:#9caac9; }
    .nav-label { font-size:10px; letter-spacing:1.6px; color:#7f8db3; padding:0 12px; margin-bottom:8px; }
    .nav { display:grid; gap:6px; }
    .nav button { background:transparent; color:#aebbd6; border:0; border-radius:12px; padding:12px 14px; display:flex; align-items:center; gap:10px; cursor:pointer; text-align:left; }
    .nav button.active, .nav button:hover { background:rgba(37,52,83,0.7); color:white; }
    .sidebar-footer { margin-top:auto; border:1px solid rgba(255,255,255,0.14); background:#1b2948; border-radius:16px; padding:14px 12px; color:#aebbd6; }
    .online { color:#6ae4b1; font-size:12px; }
    .main { display:flex; flex-direction:column; min-width:0; }
    .topbar { height:78px; background:white; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 28px 0 18px; gap:16px; }
    .topbar > div:first-child { display:flex; align-items:center; gap:12px; min-width:0; }
    .crumb { color:var(--muted); font-size:11px; letter-spacing:.18em; white-space:nowrap; }
    .topbar h2 { margin:0; font-size:18px; }
    .menu-toggle { display:none; border:0; background:#eef3ff; color:var(--navy); width:38px; height:38px; border-radius:10px; cursor:pointer; }
    .right { display:flex; align-items:center; gap:14px; }
    .date { color:var(--muted); font-size:12px; }
    .user-chip { display:flex; align-items:center; gap:10px; }
    .login-btn, .primary-btn, .secondary-btn, .ghost-btn { border:0; border-radius:10px; padding:10px 16px; font-weight:700; cursor:pointer; }
    .login-btn, .primary-btn { background:var(--blue); color:white; box-shadow:0 6px 16px rgba(69,103,245,.28); }
    .secondary-btn { background:#eff4ff; color:var(--navy); }
    .ghost-btn { background:white; border:1px solid var(--line); color:var(--ink); }
    .content { padding:28px 34px 40px; max-width:1500px; width:100%; }
    .section-title { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:20px; }
    .section-title h1 { margin:0; font-size:28px; }
    .muted { color:var(--muted); }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:20px; }
    .stat { background:white; border:1px solid var(--line); border-radius:18px; padding:18px 20px; box-shadow:var(--shadow); }
    .stat .label { color:var(--muted); font-size:12px; }
    .stat .value { font-size:28px; font-weight:800; margin-top:4px; }
    .stat .trend { margin-top:8px; font-size:12px; color:var(--success); }
    .panels { display:grid; grid-template-columns:1.5fr 1fr; gap:18px; }
    .panel { background:white; border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:18px 20px; }
    .panel-header { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; }
    .panel h3 { margin:0; font-size:18px; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:12px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
    .empty { color:var(--muted); text-align:center; padding:26px 10px; }
    .btn-row { display:flex; gap:8px; flex-wrap:wrap; }
    .meta { display:flex; align-items:center; gap:8px; }
    .badge { display:inline-flex; align-items:center; padding:6px 10px; border-radius:999px; background:var(--chip); color:var(--blue); font-weight:700; }
    .danger { color:var(--danger); }
    .footer { padding:18px 34px 24px; color:var(--muted); }
    .auth-modal[open] { border:0; border-radius:18px; padding:0; width:min(440px, calc(100vw - 28px)); background:transparent; }
    .auth-modal::backdrop { background:rgba(11,21,39,.48); }
    .auth-card { background:white; box-shadow:0 20px 60px rgba(16,27,53,.25); border-radius:18px; padding:24px; }
    .auth-header { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:18px; }
    .auth-header h2 { margin:0; font-size:22px; }
    .auth-close { background:transparent; border:0; color:var(--muted); font-size:24px; cursor:pointer; }
    .field { display:block; margin-bottom:14px; }
    .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
    .field input { width:100%; border:1px solid var(--line); border-radius:10px; padding:12px 14px; outline:none; }
    .field input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(69,103,245,.14); }
    .auth-actions { display:flex; flex-direction:column; gap:10px; }
    .status { min-height:20px; font-size:12px; margin-top:8px; color:var(--muted); }
    .status.error { color:var(--danger); }
    .status.success { color:var(--success); }
    @media (max-width: 860px) {
      .app { grid-template-columns:1fr; }
      .sidebar { display:none; }
      .menu-toggle { display:inline-grid; place-items:center; }
      .content { padding:20px 16px 26px; }
      .topbar { padding:0 16px; }
      .footer { padding:0 16px 18px; }
      .panels { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">R</div>
        <div>
          <strong>Rasho Tech</strong>
          <small>Sales Manager</small>
        </div>
      </div>
      <div>
        <div class="nav-label">WORKSPACE</div>
        <nav class="nav" id="nav">
          <button class="active" data-page="Dashboard"><span>◉</span>Dashboard</button>
          <button data-page="Sales"><span>◫</span>Sales</button>
          <button data-page="Products"><span>◈</span>Products</button>
          <button data-page="Stock"><span>◌</span>Stock</button>
          <button data-page="Customers"><span>◎</span>Customers</button>
          <button data-page="Expenses"><span>◐</span>Expenses</button>
          <button data-page="Reports"><span>◍</span>Reports</button>
        </nav>
      </div>
      <div class="sidebar-footer">
        <div class="online">● Workspace active</div>
        <p style="margin:8px 0 0; color:#aebbd6;">Entries are saved in this browser unless you sign in with Supabase.</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <button class="menu-toggle" id="menuToggle" aria-label="Open menu">☰</button>
          <div class="crumb">RASHO TECH / WORKSPACE</div>
          <h2 id="topTitle">Dashboard</h2>
        </div>
        <div class="right">
          <div class="date" id="today"></div>
          <div class="user-chip">
            <span id="userLabel" class="badge" style="display:none"></span>
            <button class="login-btn" id="loginToggle" type="button">Log in</button>
          </div>
        </div>
      </header>

      <div class="content" id="content"></div>
      <div class="footer">Rasho Tech Sales Manager — synced with Supabase Auth when configured.</div>
    </main>
  </div>

  <dialog id="authModal" class="auth-modal">
    <div class="auth-card">
      <div class="auth-header">
        <h2 id="authTitle">Log in</h2>
        <button class="auth-close" type="button" aria-label="Close" id="authClose">×</button>
      </div>
      <form id="authForm">
        <div class="field">
          <label for="authEmail">Email</label>
          <input id="authEmail" type="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="authPassword">Password</label>
          <input id="authPassword" type="password" placeholder="••••••••" minlength="6" required>
        </div>
        <div class="auth-actions">
          <button class="primary-btn" id="authSubmit" type="submit">Log in</button>
          <button class="secondary-btn" id="switchAuthMode" type="button">Create account</button>
          <button class="ghost-btn" type="button" id="authCancel">Cancel</button>
        </div>
        <div id="authStatus" class="status"></div>
      </form>
    </div>
  </dialog>

  <script>
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => Array.from(document.querySelectorAll(sel));
    const fmt = (n) => 'KSh ' + Number(n || 0).toLocaleString('en-KE', { maximumFractionDigits: 2 });

    const STORAGE_KEYS = {
      Sales: 'rasho_sales_v1',
      Products: 'rasho_products_v1',
      Customers: 'rasho_customers_v1',
      Expenses: 'rasho_expenses_v1'
    };

    const storage = {
      load: (key) => {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEYS[key]) || '[]'); }
        catch { return []; }
      },
      save: (key, value) => localStorage.setItem(STORAGE_KEYS[key], JSON.stringify(value))
    };

    const sample = {
      Products: [
        { id: 1, name: 'Lenovo ThinkPad', category: 'Laptop', stock: 12, price: 89000 },
        { id: 2, name: 'Cisco Switch', category: 'Networking', stock: 8, price: 65000 },
        { id: 3, name: 'HP Printer', category: 'Office', stock: 5, price: 32000 }
      ],
      Customers: [
        { id: 1, name: 'Nairobi Motors', phone: '+254712000111', city: 'Nairobi' },
        { id: 2, name: 'Green Valley Foods', phone: '+254723456099', city: 'Mombasa' }
      ],
      Sales: [
        { id: 1, product: 'Lenovo ThinkPad', customer: 'Nairobi Motors', quantity: 2, unitPrice: 89000, total: 178000, date: '2026-10-20' },
        { id: 2, product: 'Cisco Switch', customer: 'Green Valley Foods', quantity: 1, unitPrice: 65000, total: 65000, date: '2026-10-22' }
      ],
      Expenses: [
        { id: 1, category: 'Transport', amount: 14500, date: '2026-10-19', note: 'Fuel and travel' },
        { id: 2, category: 'Marketing', amount: 22000, date: '2026-10-21', note: 'Campaign spend' }
      ]
    };

    function seedDefaults() {
      Object.entries(sample).forEach(([key, items]) => {
        if (!localStorage.getItem(STORAGE_KEYS[key])) {
          storage.save(key, items);
        }
      });
    }

    const state = { page: 'Dashboard', authMode: 'login', user: null };

    const supabaseConfig = {
      url: window.RASHO_SUPABASE_URL || 'https://YOUR_PROJECT_REF.supabase.co',
      anonKey: window.RASHO_SUPABASE_ANON_KEY || 'YOUR_SUPABASE_ANON_KEY'
    };

    let supabaseClient = null;

    function initSupabase() {
      if (!window.supabase) return null;
      if (supabaseConfig.url.includes('YOUR_PROJECT_REF') || supabaseConfig.anonKey.includes('YOUR_SUPABASE')) {
        return null;
      }
      supabaseClient = window.supabase.createClient(supabaseConfig.url, supabaseConfig.anonKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });
      return supabaseClient;
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function shell(title, subtitle, button = '') {
      return `<div class="section-title"><div><h1>${title}</h1><div class="muted" style="margin-top:5px">${subtitle}</div></div>${button}</div>`;
    }

    function allSales() { return storage.load('Sales'); }
    function productRows() { return storage.load('Products'); }
    function customerRows() { return storage.load('Customers'); }
    function expenses() { return storage.load('Expenses'); }

    function dashboard() {
      const sales = allSales();
      const products = productRows();
      const customers = customerRows();
      const ex = expenses();
      const revenue = sales.reduce((sum, item) => sum + Number(item.total || 0), 0);
      const cost = ex.reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const totalUnits = sales.reduce((sum, item) => sum + Number(item.quantity || 0), 0);
      const lowStock = products.filter((p) => Number(p.stock || 0) <= 5).length;

      return `
        ${shell('Dashboard', 'Overview of sales performance and operations', `<span class="badge">${state.user ? 'Connected' : 'Local mode'}</span>`)}
        <div class="stats">
          <div class="stat"><div class="label">Revenue</div><div class="value">${fmt(revenue)}</div><div class="trend">+12.4% vs last month</div></div>
          <div class="stat"><div class="label">Total sales</div><div class="value">${sales.length}</div><div class="trend">${totalUnits} units sold</div></div>
          <div class="stat"><div class="label">Customers</div><div class="value">${customers.length}</div><div class="trend">Active customer base</div></div>
          <div class="stat"><div class="label">Expenses</div><div class="value">${fmt(cost)}</div><div class="trend">${lowStock} low-stock items</div></div>
        </div>
        <div class="panels">
          <div class="panel">
            <div class="panel-header"><h3>Recent sales</h3><span class="muted">Latest 5</span></div>
            <table>
              <thead><tr><th>Product</th><th>Customer</th><th>Qty</th><th>Total</th><th>Date</th></tr></thead>
              <tbody>
                ${sales.slice().reverse().slice(0, 5).map((row) => `
                  <tr>
                    <td>${esc(row.product)}</td>
                    <td>${esc(row.customer)}</td>
                    <td>${esc(row.quantity)}</td>
                    <td>${fmt(row.total)}</td>
                    <td>${esc(row.date)}</td>
                  </tr>
                `).join('') || '<tr><td colspan="5" class="empty">No sales yet.</td></tr>'}
              </tbody>
            </table>
          </div>
          <div class="panel">
            <div class="panel-header"><h3>Inventory alert</h3><span class="badge">${lowStock} low</span></div>
            <table>
              <thead><tr><th>Product</th><th>Stock</th></tr></thead>
              <tbody>
                ${products.filter((p) => Number(p.stock || 0) <= 5).map((p) => `
                  <tr><td>${esc(p.name)}</td><td>${esc(p.stock)}</td></tr>
                `).join('') || '<tr><td colspan="2" class="empty">All products stocked above threshold.</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function tablePage(type) {
      const arr = storage.load(type);
      const fieldMap = {
        Sales: [['product', 'Product'], ['customer', 'Customer'], ['quantity', 'Qty'], ['date', 'Date'], ['total', 'Total']],
        Products: [['name', 'Product'], ['category', 'Category'], ['stock', 'Stock'], ['price', 'Price']],
        Customers: [['name', 'Customer'], ['phone', 'Phone'], ['city', 'City']],
        Expenses: [['category', 'Category'], ['amount', 'Amount'], ['date', 'Date'], ['note', 'Note']]
      };
      const cfg = {
        Sales: { button: '＋ Add sale', type: 'Sales' },
        Products: { button: '＋ Add product', type: 'Products' },
        Customers: { button: '＋ Add customer', type: 'Customers' },
        Expenses: { button: '＋ Add expense', type: 'Expenses' }
      };
      const fields = fieldMap[type] || [];

      return `
        ${shell(type, 'Operational records and transaction history', `<button class="primary-btn" type="button" onclick="openForm('${type}')">${cfg[type].button}</button>`)}
        <div class="panel">
          <table>
            <thead><tr>${fields.map(([key, label]) => `<th>${label}</th>`).join('')}<th>Action</th></tr></thead>
            <tbody>
              ${arr.length ? arr.map((row) => `
                <tr>
                  ${fields.map(([key]) => `<td>${esc(row[key])}</td>`).join('')}
                  <td><button class="ghost-btn" type="button" onclick="removeRecord('${type}', ${row.id})">Delete</button></td>
                </tr>
              `).join('') : `<tr><td colspan="${fields.length + 1}" class="empty">No records yet.</td></tr>`}
            </tbody>
          </table>
        </div>
      `;
    }

    function stockPage() {
      const products = productRows();
      const rows = products.map((product) => ({ ...product, status: Number(product.stock || 0) <= 5 ? 'Low stock' : 'Healthy' }));
      return `
        ${shell('Stock', 'Monitor inventory quantities and replenishment needs', `<button class="primary-btn" type="button" onclick="openForm('Products')">＋ Add product</button>`)}
        <div class="panel">
          <table>
            <thead><tr><th>Product</th><th>Category</th><th>Stock</th><th>Status</th></tr></thead>
            <tbody>
              ${rows.length ? rows.map((row) => `
                <tr>
                  <td>${esc(row.name)}</td>
                  <td>${esc(row.category)}</td>
                  <td>${esc(row.stock)}</td>
                  <td><span class="badge" style="background:${row.status === 'Low stock' ? '#fff0ef' : '#edfdf4'};color:${row.status === 'Low stock' ? '#d9534f' : '#1f9d61'}">${row.status}</span></td>
                </tr>
              `).join('') : '<tr><td colspan="4" class="empty">No products available.</td></tr>'}
            </tbody>
          </table>
        </div>
      `;
    }

    function reports() {
      const sales = allSales();
      const ex = expenses();
      const revenue = sales.reduce((sum, item) => sum + Number(item.total || 0), 0);
      const cost = ex.reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const profit = revenue - cost;
      return `
        ${shell('Reports', 'A quick summary of your business performance', '<button class="primary-btn" type="button">Export</button>')}
        <div class="stats">
          <div class="stat"><div class="label">Gross revenue</div><div class="value">${fmt(revenue)}</div><div class="trend">Sales income</div></div>
          <div class="stat"><div class="label">Expenses</div><div class="value">${fmt(cost)}</div><div class="trend">Operating costs</div></div>
          <div class="stat"><div class="label">Net profit</div><div class="value">${fmt(profit)}</div><div class="trend">Estimated margin</div></div>
        </div>
      `;
    }

    const configs = {
      Sales: { title: 'Record sale', fields: [
        ['product', 'Product name', 'text', true],
        ['customer', 'Customer', 'text', true],
        ['quantity', 'Quantity', 'number', true],
        ['unitPrice', 'Unit price (KSh)', 'number', true],
        ['date', 'Date', 'date', true]
      ] },
      Products: { title: 'Add product', fields: [
        ['name', 'Product name', 'text', true],
        ['category', 'Category', 'text', true],
        ['stock', 'Stock', 'number', true],
        ['price', 'Unit price (KSh)', 'number', true]
      ] },
      Customers: { title: 'Add customer', fields: [
        ['name', 'Customer name', 'text', true],
        ['phone', 'Phone', 'tel', true],
        ['city', 'City', 'text', true]
      ] },
      Expenses: { title: 'Add expense', fields: [
        ['category', 'Category', 'text', true],
        ['amount', 'Amount (KSh)', 'number', true],
        ['date', 'Date', 'date', true],
        ['note', 'Note', 'text', false]
      ] }
    };

    function openForm(type) {
      const cfg = configs[type];
      if (!cfg) return;
      $('#authStatus').className = 'status';
      $('#authStatus').textContent = '';
      $('#modalTitle').textContent = cfg.title;
      $('#modalBody').innerHTML = `
        <form id="recordForm">
          <div class="field-grid">
            ${cfg.fields.map(([field, label, kind, required]) => `
              <div class="field">
                <label for="${field}">${label}${required ? ' *' : ''}</label>
                <input id="${field}" name="${field}" type="${kind}" ${required ? 'required' : ''}>
              </div>
            `).join('')}
          </div>
          <div class="auth-actions" style="margin-top:16px;">
            <button class="primary-btn" type="submit">Save</button>
            <button class="ghost-btn" type="button" id="closeModalBtn">Cancel</button>
          </div>
        </form>
      `;
      $('#recordForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const form = new FormData(event.target);
        const item = Object.fromEntries(form.entries());
        const list = storage.load(type);

        if (type === 'Sales') {
          const qty = Number(item.quantity || 0);
          const unitPrice = Number(item.unitPrice || 0);
          item.total = qty * unitPrice;
          item.id = Date.now();
          item.date = item.date || new Date().toISOString().slice(0, 10);
          storage.save(type, [...list, item]);
        } else if (type === 'Products') {
          item.id = Date.now();
          item.stock = Number(item.stock || 0);
          item.price = Number(item.price || 0);
          storage.save(type, [...list, item]);
        } else if (type === 'Customers') {
          item.id = Date.now();
          storage.save(type, [...list, item]);
        } else if (type === 'Expenses') {
          item.id = Date.now();
          item.amount = Number(item.amount || 0);
          item.date = item.date || new Date().toISOString().slice(0, 10);
          storage.save(type, [...list, item]);
        }

        $('#modal').close();
        render();
      });
      $('#closeModalBtn').addEventListener('click', () => $('#modal').close());
      $('#modal').showModal();
    }

    function removeRecord(type, id) {
      if (!confirm('Delete this record?')) return;
      const list = storage.load(type).filter((item) => item.id !== id);
      storage.save(type, list);
      render();
    }

    function render() {
      const content = $('#content');
      $('#topTitle').textContent = state.page;
      $$('[data-page]').forEach((button) => button.classList.toggle('active', button.dataset.page === state.page));

      if (state.page === 'Dashboard') content.innerHTML = dashboard();
      else if (state.page === 'Sales' || state.page === 'Products' || state.page === 'Customers' || state.page === 'Expenses') content.innerHTML = tablePage(state.page);
      else if (state.page === 'Stock') content.innerHTML = stockPage();
      else if (state.page === 'Reports') content.innerHTML = reports();
    }

    function updateUserUI() {
      const userLabel = $('#userLabel');
      const loginToggle = $('#loginToggle');
      if (state.user) {
        userLabel.textContent = state.user.email || 'Signed in';
        userLabel.style.display = 'inline-flex';
        loginToggle.textContent = 'Log out';
      } else {
        userLabel.style.display = 'none';
        loginToggle.textContent = 'Log in';
      }
    }

    function setAuthStatus(message, type = '') {
      const node = $('#authStatus');
      node.textContent = message || '';
      node.className = 'status' + (type ? ` ${type}` : '');
    }

    function toggleAuthMode() {
      state.authMode = state.authMode === 'login' ? 'signup' : 'login';
      const title = state.authMode === 'login' ? 'Log in' : 'Create account';
      $('#authTitle').textContent = title;
      $('#authSubmit').textContent = title;
      $('#switchAuthMode').textContent = state.authMode === 'login' ? 'Create account' : 'Back to log in';
      setAuthStatus('');
    }

    async function handleAuthSubmit(event) {
      event.preventDefault();
      const email = $('#authEmail').value.trim();
      const password = $('#authPassword').value;

      if (!supabaseClient) {
        setAuthStatus('Add your Supabase project URL and anon key in the page to enable real auth.', 'error');
        return;
      }

      if (!email || !password) {
        setAuthStatus('Please enter both email and password.', 'error');
        return;
      }

      try {
        if (state.authMode === 'login') {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          state.user = data.user;
          setAuthStatus('Logged in successfully.', 'success');
          updateUserUI();
          $('#authModal').close();
        } else {
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) throw error;
          state.user = data.user;
          setAuthStatus('Account created. Check your email to confirm.', 'success');
          updateUserUI();
          $('#authModal').close();
        }
      } catch (error) {
        setAuthStatus(error.message || 'Authentication failed.', 'error');
      }
    }

    async function signOut() {
      if (!supabaseClient) {
        state.user = null;
        updateUserUI();
        return;
      }
      const { error } = await supabaseClient.auth.signOut();
      if (!error) {
        state.user = null;
        updateUserUI();
      }
    }

    async function initializeAuth() {
      const client = initSupabase();
      if (!client) {
        updateUserUI();
        return;
      }

      const { data: { session } } = await client.auth.getSession();
      state.user = session?.user || null;
      updateUserUI();

      client.auth.onAuthStateChange((_event, session) => {
        state.user = session?.user || null;
        updateUserUI();
      });
    }

    document.getElementById('today').textContent = new Date().toLocaleDateString('en-KE', {
      weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
    });

    $$('#nav button').forEach((button) => {
      button.addEventListener('click', () => {
        state.page = button.dataset.page;
        render();
      });
    });

    $('#menuToggle').addEventListener('click', () => {
      const sidebar = $('#sidebar');
      sidebar.style.display = sidebar.style.display === 'flex' ? 'none' : 'flex';
    });

    $('#loginToggle').addEventListener('click', async () => {
      if (state.user) {
        await signOut();
        return;
      }
      $('#authModal').showModal();
      setAuthStatus('');
    });

    $('#authClose, #authCancel').forEach((node) => {
      node.addEventListener('click', () => $('#authModal').close());
    });

    $('#switchAuthMode').addEventListener('click', toggleAuthMode);
    $('#authForm').addEventListener('submit', handleAuthSubmit);

    $('#modal').showModal = function() {
      try {
        HTMLDialogElement.prototype.showModal.call(this);
      } catch {
        return null;
      }
    };

    const modalTemplate = `
      <dialog id="modal" style="border:0;border-radius:18px;padding:24px;width:min(520px, calc(100% - 28px));box-shadow:0 20px 70px rgba(16,27,53,.24);">
        <div class="auth-header" style="margin:0 0 16px;">
          <h2 id="modalTitle">Add record</h2>
          <button class="auth-close" type="button" aria-label="Close" id="closeModalX">×</button>
        </div>
        <div id="modalBody"></div>
      </dialog>
    `;
    document.body.insertAdjacentHTML('beforeend', modalTemplate);
    $('#closeModalX').addEventListener('click', () => $('#modal').close());

    seedDefaults();
    render();
    initializeAuth();
  </script>
</body>
</html>
