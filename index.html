<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rasho Tech Sales Manager</title>
<style>
:root{--navy:#101b35;--blue:#4567f5;--cyan:#21c6b7;--ink:#18243b;--muted:#7a859a;--bg:#f4f7fb;--line:#e7ecf4;--white:#fff;--shadow:0 12px 32px #18243b0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}a{text-decoration:none}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{background:var(--navy);color:#dbe3f7;padding:24px 16px;display:flex;flex-direction:column;gap:28px}.brand{display:flex;gap:12px;align-items:center;padding:0 8px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px}.brand strong{font-size:16px;color:#fff;display:block}.brand small{color:#9caac9}.nav-label{font-size:10px;letter-spacing:1.6px;color:#7f8eb5;padding:0 12px;margin-bottom:8px}.nav{display:grid;gap:5px}.nav button{border:0;color:#aebbd6;background:transparent;text-align:left;padding:12px;border-radius:11px;display:flex;align-items:center;gap:12px}.nav button span{width:20px;text-align:center}.nav button.active,.nav button:hover{background:#253453;color:#fff}.sidebar-footer{margin-top:auto;border:1px solid #2c3a58;background:#1b2946;padding:14px;border-radius:14px;font-size:12px;color:#aebbd6}.online{color:#68e0be;font-size:11px}.main{display:flex;flex-direction:column;min-width:0}.topbar{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px 0 18px;gap:16px}.crumb{color:var(--muted);font-size:12px;letter-spacing:.6px}.topbar h2{font-size:19px;margin:0}.right{display:flex;align-items:center;gap:16px}.date{color:var(--muted);font-size:12px}.avatar{height:38px;width:38px;border-radius:50%;display:grid;place-items:center;background:#e6eaff;color:var(--blue);font-weight:800}.user-chip{display:flex;align-items:center;gap:12px;background:#f3f5fb;border:1px solid var(--line);padding:6px 10px 6px 8px;border-radius:999px}.user-meta{display:flex;flex-direction:column;line-height:1.1}.user-meta strong{font-size:12px}.user-meta small{color:var(--muted);font-size:10px}.login-btn,.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(69,103,245,.25)}.login-btn:hover,.btn:hover{filter:brightness(1.04)}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.small{padding:8px 12px;font-size:12px}.content{padding:28px 34px 40px;max-width:1500px;margin:auto;width:100%}.welcome{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}.welcome h1{margin:0;font-size:26px;letter-spacing:-.7px}.welcome p{margin:5px 0 0;color:var(--muted)}.btnn{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:11px 15px;font-weight:700}.btnn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:20px}.stat-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-icon{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:#edf1ff;color:var(--blue);font-size:18px}.stat h3{margin:12px 0 0;font-size:30px;letter-spacing:-.8px}.hint{font-size:11px;color:var(--muted)}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.panel{padding:21px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.panel-head h3{margin:0;font-size:15px}.pill{padding:6px 10px;border-radius:999px;background:#eef7ff;color:#2472c5;font-size:11px;font-weight:700}.bars{height:190px;display:flex;align-items:flex-end;gap:12px;padding-top:10px}.bar-col{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;flex:1}.bar{width:min(35px,100%);border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,#6c8ef6,#4567f5);min-height:5px}.bar-label{font-size:10px;color:var(--muted)}.activity{display:grid;gap:12px}.activity-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.activity-row:last-child{border-bottom:0}.activity-icon{width:38px;height:38px;border-radius:12px;background:#eefbf8;color:#136d5b;display:grid;place-items:center}.activity-row strong{display:block;font-size:12px}.activity-row small{color:var(--muted)}.activity-row .amount{font-weight:800}.section-title{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:20px 0 12px}.section-title h1{margin:0;font-size:23px;letter-spacing:-.6px}.section-title .muted{color:var(--muted);font-size:12px}.search{padding:10px 12px;border:1px solid var(--line);border-radius:10px;min-width:190px;outline-color:var(--blue)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field label{font-size:11px;color:var(--muted);font-weight:700}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;outline-color:var(--blue);background:#fff}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.hidden{display:none!important}.notice{border:1px solid #d8eee7;background:#f0fbf7;color:#16785f;padding:12px 14px;border-radius:10px;margin-bottom:16px;font-size:12px}.footer{color:#9aa4b5;text-align:center;font-size:11px;padding:14px}.menu-toggle{display:none;border:0;background:transparent;font-size:22px;color:#fff}.dialog{border:0;border-radius:16px;padding:24px;width:min(520px,calc(100% - 28px));box-shadow:0 20px 70px #101b3540}.dialog .panel-head{margin-bottom:18px}.auth-modal{border:0;border-radius:16px;padding:24px;width:min(480px,calc(100% - 28px));box-shadow:0 20px 70px #101b3540}.auth-form{display:grid;gap:14px}.auth-form .field{display:grid;gap:8px}.auth-form .field input{padding:12px 14px}.auth-form .form-actions{margin-top:8px}.#modal[open],#authModal[open]{display:block}.table-wrap{overflow:auto}.table-wrap table{width:100%;border-collapse:collapse;white-space:nowrap}.th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}.th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px}.td strong{font-size:12px}.empty{padding:28px;text-align:center;color:var(--muted)}.pile{padding:4px 8px;border-radius:999px;background:#fff1d9;color:#a06b1a;font-weight:700;font-size:10px}.status-low{background:#fff1f2;color:#b33848}.status-good{background:#edfdf5;color:#1a7b5c}.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.stat-box{padding:18px 16px;border-radius:16px;background:#fff;border:1px solid var(--line)}.stat-box h4{margin:0;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px}.stat-box h5{margin:10px 0 0;font-size:26px}.summary-note{margin-top:16px;color:var(--muted);font-size:12px}.settings-note{font-size:12px;margin-top:8px;color:var(--muted)}.calendar-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:16px}.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.kpi h4{margin:0;color:var(--muted);font-size:11px;text-transform:uppercase}.kpi b{display:block;font-size:28px;margin-top:10px}.@media(max-width:1050px){.app{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:flex;position:fixed;z-index:5;inset:0 auto 0 0;width:250px}.menu-toggle{display:block}.topbar{padding:0 18px}.content{padding:20px 18px 32px}.stats,.layout{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.stats-grid{grid-template-columns:2fr 2fr}.calendar-grid{grid-template-columns:2fr 2fr}}@media(max-width:760px){.stats,.stats-grid,.calendar-grid{grid-template-columns:1fr}.topbar{height:68px}.welcome{flex-direction:column}.right .date{display:none}.form-grid{grid-template-columns:1fr}.search{width:100%}.section-title{flex-direction:column;align-items:flex-start}.user-chip .user-meta{display:none}.user-chip{padding:7px 8px}} </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">R</div>
      <div><strong>Rasho Tech</strong><small>Sales Manager</small></div>
    </div>
    <div>
      <div class="nav-label">WORKSPACE</div>
      <nav class="nav" id="nav">
        <button class="active" data-page="Dashboard"><span>◉</span>Dashboard</button>
        <button data-page="Sales"><span>◫</span>Sales</button>
        <button data-page="Products"><span>◈</span>Products</button>
        <button data-page="Stock"><span>◌</span>Stock</button>
        <button data-page="Customers"><span>◎</span>Customers</button>
        <button data-page="Expenses"><span>◐</span>Expenses</button>
        <button data-page="Reports"><span>◍</span>Reports</button>
      </nav>
    </div>
    <div class="sidebar-footer">
      <div class="online">● Local workspace active</div>
      <p style="margin:8px 0 0">Your entries are saved in this browser on this device.</p>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-toggle" id="menuToggle" aria-label="Open menu">☰</button>
        <div class="crumb">RASHO TECH / WORKSPACE</div>
        <h2 id="topTitle">Dashboard</h2>
      </div>
      <div class="right">
        <div class="date" id="today"></div>
        <div class="user-chip" id="userChip">
          <button class="login-btn" id="loginToggle" type="button">Log in</button>
        </div>
      </div>
    </header>
    <div class="content" id="content"></div>
    <div class="footer">Rasho Tech Sales Manager — Modern workspace preview</div>
  </main>
</div>
<dialog id="modal" class="dialog">
  <div class="panel-head">
    <h3 id="modalTitle">Add record</h3>
    <button class="btn secondary small" id="closeModal" type="button">Close</button>
  </div>
  <div id="modalBody"></div>
</dialog>
<dialog id="authModal" class="auth-modal">
  <div class="panel-head">
    <h3 id="authTitle">Log in</h3>
    <button class="btn secondary small" id="closeAuthModal" type="button">Close</button>
  </div>
  <form id="authForm" class="auth-form">
    <div class="field">
      <label for="authEmail">Email</label>
      <input id="authEmail" name="email" type="email" placeholder="you@company.com" required>
    </div>
    <div class="field">
      <label for="authPassword">Password</label>
      <input id="authPassword" name="password" type="password" placeholder="••••••••" required>
    </div>
    <div class="form-actions">
      <button class="btn secondary" type="button" id="cancelAuth">Cancel</button>
      <button class="btn" type="submit">Log in</button>
    </div>
  </form>
</dialog>
<script>
const $=s=>document.querySelector(s);
const fmt=n=>'KSh '+Number(n||0).toLocaleString('en-KE',{maximumFractionDigits:2});
const keys={Sales:'rasho_sales_v1',Products:'rasho_products_v1',Customers:'rasho_customers_v1',Expenses:'rasho_expenses_v1'};
const load=k=>{try{return JSON.parse(localStorage.getItem(keys[k])||'[]')}catch{return []}};const save=(k,v)=>localStorage.setItem(keys[k],JSON.stringify(v));
const authKey='rasho_auth_user_v1';
function getAuthUser(){try{const raw=localStorage.getItem(authKey);return raw?JSON.parse(raw):null}catch{return null}}
function setAuthUser(user){localStorage.setItem(authKey,JSON.stringify(user));}
function initialsFrom(name=''){const parts=(name||'').trim().split(/\s+/).filter(Boolean);if(!parts.length)return 'RT';return parts.slice(0,2).map(p=>p[0].toUpperCase()).join('').slice(0,2);}
function renderAuthUser(){
  const chip=$('#userChip');
  if(!chip)return;
  const user=getAuthUser();
  if(!user){
    chip.innerHTML='<button class="login-btn" id="loginToggle" type="button">Log in</button>';
    const trigger=$('#loginToggle');
    if(trigger) trigger.onclick=()=>$('#authModal').showModal();
    return;
  }
  const name=(user.name||((user.email||'User').split('@')[0])).trim();
  chip.innerHTML=`<div class="avatar">${initialsFrom(name)}</div><div class="user-meta"><strong>${esc(name)}</strong><small>Signed in</small></div><button class="btn secondary small" id="logoutBtn" type="button">Log out</button>`;
  const logoutBtn=$('#logoutBtn');
  if(logoutBtn) logoutBtn.onclick=()=>{localStorage.removeItem(authKey);renderAuthUser();};
}
function openAuthModal(){const modal=$('#authModal'); if(modal) modal.showModal();}
function closeAuthModal(){const modal=$('#authModal'); if(modal) modal.close();}
let page='Dashboard';$('#today').textContent=new Date().toLocaleDateString('en-KE',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
function allSales(){return load('Sales')}function productRows(){return load('Products')}function customerRows(){return load('Customers')}function expenses(){return load('Expenses')}
function shell(title,subtitle,button=''){return `<div class="section-title"><div><h1>${title}</h1><div class="muted" style="margin-top:5px">${subtitle}</div></div>${button}</div>`}
function dashboard(){let sales=allSales(),products=productRows(),customers=customerRows(),ex=expenses(),revenue=sales.reduce((a,x)=>a+Number(x.total||0),0),cost=ex.reduce((a,x)=>a+Number(x.amount||0),0),stock=products.reduce((a,x)=>a+Number(x.stock||0),0),months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];let now=new Date();let values=months.map((m,i)=>sales.filter(s=>{let d=new Date(s.date);return d.getMonth()===i&&d.getFullYear()===now.getFullYear()}).reduce((a,s)=>a+Number(s.total||0),0));let max=Math.max(1,...values);let recent=[...sales].reverse().slice(0,5);return `<div class="welcome"><div><h1>Good day 👋</h1><p>Here's what's happening with your business today.</p></div><button class="btnn" onclick="openForm('Sales')">＋ Record a sale</button></div><div class="stats"><div class="stat"><div class="stat-head"><span>Total sales</span><span class="stat-icon">◉</span></div><h3>${fmt(revenue)}</h3><div class="hint">${sales.length} sales records</div></div><div class="stat"><div class="stat-head"><span>Products</span><span class="stat-icon">◈</span></div><h3>${products.length}</h3><div class="hint">${stock} units in stock</div></div><div class="stat"><div class="stat-head"><span>Customers</span><span class="stat-icon">◎</span></div><h3>${customers.length}</h3><div class="hint">Saved customer records</div></div><div class="stat"><div class="stat-head"><span>Expenses</span><span class="stat-icon">◐</span></div><h3>${fmt(cost)}</h3><div class="hint">Recorded expenses</div></div></div><div class="layout"><section class="panel"><div class="panel-head"><h3>Sales overview</h3><div class="pill">Monthly sales ${new Date().getFullYear()}</div></div><div class="bars">${months.map((m,i)=>`<div class="bar-col"><div class="bar" style="height:${Math.max(8,values[i]/max*100)}%" title="${m}: ${fmt(values[i])}"></div><div class="bar-label">${m}</div></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><h3>Recent sales</h3><button class="btn secondary small" onclick="go('Sales')">View all</button></div>${recent.length?`<div class="activity">${recent.map(s=>`<div class="activity-row"><div style="display:flex;align-items:center;gap:12px"><div class="activity-icon">◫</div><div><strong>${esc(s.product||'Product')}</strong><small>${esc(s.customer||'Walk-in')} • ${esc(s.date||'')}</small></div></div><div class="amount">${fmt(s.total)}</div></div>`).join('')}</div>`:`<div class="empty">No sales yet. Use “Record a sale” to add your first sale.</div>`}</section></div><section class="panel" style="margin-top:18px"><div class="panel-head"><h3>Quick actions</h3></div><div class="activity">${[['Products','Add product','Register an item and price','openForm(\'Products\')'],['Customers','Add customer','Save customer details','openForm(\'Customers\')'],['Expenses','Record expense','Track business costs','openForm(\'Expenses\')']].map(([type,title,desc,click])=>`<div class="activity-row"><div style="display:flex;align-items:center;gap:12px"><div class="activity-icon">${type==='Products'?'◈':type==='Customers'?'◎':'◐'}</div><div><strong>${title}</strong><small>${desc}</small></div></div><button class="btn secondary small" onclick="${click}">${type==='Products'?'Add':type==='Customers'?'Add':'Add'}</button></div>`).join('')}</div></section>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const configs={Sales:{button:'＋ Record sale',fields:[['product','Product name','text',true],['customer','Customer','text',false],['quantity','Quantity','number',true],['unitPrice','Unit price (KSh)','number',true],['date','Date','date',true]],subtitle:'Track sales and revenue'},Products:{button:'＋ Add product',fields:[['name','Product name','text',true],['sku','SKU / Code','text',false],['price','Selling price (KSh)','number',true],['stock','Opening stock (units)','number',true]],subtitle:'Manage your product catalogue'},Customers:{button:'＋ Add customer',fields:[['name','Customer name','text',true],['phone','Phone number','tel',false],['email','Email address','email',false]],subtitle:'Keep customer details in one place'},Expenses:{button:'＋ Record expense',fields:[['title','Expense description','text',true],['category','Category','text',true],['amount','Amount (KSh)','number',true],['date','Date','date',true]],subtitle:'Track operating costs'}};
function openForm(type){let cfg=configs[type];if(!cfg)return;$('#modalTitle').textContent=cfg.button.replace('＋ ','');$('#modalBody').innerHTML=`<form id="recordForm"><div class="form-grid">${cfg.fields.map(f=>`<div class="field"><label>${f[1]}</label><input name="${f[0]}" type="${f[2]}" ${f[3]?'required':''} ${f[2]==='date' ? `value="${new Date().toISOString().slice(0,10)}"` : ''} ${f[2]==='number' ? 'min="0" step="any"' : ''}></div>`).join('')}</div><div class="form-actions"><button class="btn secondary" type="button" onclick="$('#modal').close()">Cancel</button><button class="btn" type="submit">Save record</button></div></form>`;$('#recordForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());if(type==='Sales'){d.quantity=Number(d.quantity);d.unitPrice=Number(d.unitPrice);d.total=d.quantity*d.unitPrice;let arr=load('Sales');arr.push({id:Date.now(),...d});save('Sales',arr)}else if(type==='Products'){d.price=Number(d.price);d.stock=Number(d.stock);let arr=load('Products');arr.push({id:Date.now(),...d});save('Products',arr)}else if(type==='Customers'){let arr=load('Customers');arr.push({id:Date.now(),...d});save('Customers',arr)}else if(type==='Expenses'){d.amount=Number(d.amount);let arr=load('Expenses');arr.push({id:Date.now(),...d});save('Expenses',arr)}$('#modal').close();render();};$('#modal').showModal();}
function tablePage(type){let arr=load(type),cfg=configs[type],fields=type==='Sales'?[['product','Product'],['customer','Customer'],['quantity','Qty'],['date','Date'],['total','Total']]:type==='Products'?[['name','Product'],['sku','SKU'],['price','Price'],['stock','Stock']]:type==='Customers'?[['name','Name'],['phone','Phone'],['email','Email']]:[['title','Description'],['category','Category'],['date','Date'],['amount','Amount']];return `${shell(type,cfg.subtitle,`<button class="btn" onclick="openForm('${type}')">${cfg.button}</button>`)}<section class="panel"><div class="panel-head"><h3>${type} records <span class="muted">(${arr.length})</span></h3><input class="search" id="search" placeholder="Search ${type.toLowerCase()}..."></div><div class="table-wrap"><table><thead><tr>${fields.map(f=>`<th>${f[1]}</th>`).join('')}<th>Action</th></tr></thead><tbody id="rows">${renderRows(type,arr,fields)}</tbody></table></div></section>`}
function renderRows(type,arr,fields){if(!arr.length)return `<tr><td colspan="${fields.length+1}" class="empty">No records yet. Click the button above to add one.</td></tr>`;return [...arr].reverse().map(item=>`<tr>${fields.map(([k,h])=>`<td>${k==='total'||k==='price'||k==='amount'?fmt(item[k]):k==='date'?esc(item[k]||''):esc(item[k]||'')}</td>`).join('')}<td><button class="btn secondary small" onclick="removeRecord('${type}',${item.id})">Delete</button></td></tr>`).join('')}
function removeRecord(type,id){if(!confirm('Delete this record?'))return;save(type,load(type).filter(x=>x.id!==id));render();}
function stockPage(){let products=productRows();return `${shell('Stock','Monitor quantities and low-stock items',`<button class="btn" onclick="openForm('Products')">＋ Add product</button>`)}<section class="panel"><div class="panel-head"><h3>Inventory levels</h3><span class="pill">${products.reduce((a,p)=>a+Number(p.stock||0),0)} units</span></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Unit price</th><th>Units available</th><th>Status</th></tr></thead><tbody>${products.length?products.map(p=>`<tr><td><strong>${esc(p.name||'Product')}</strong></td><td>${esc(p.sku||'—')}</td><td>${fmt(p.price)}</td><td>${Number(p.stock||0)}</td><td><span class="pile ${Number(p.stock||0)<=5?'status-low':'status-good'}">${Number(p.stock||0)<=5?'Low stock':'In stock'}</span></td></tr>`).join(''):`<tr><td colspan="5" class="empty">No products added yet.</td></tr>`}</tbody></table></div></section>`}
function reports(){let s=allSales(),e=expenses(),rev=s.reduce((a,x)=>a+Number(x.total||0),0),cost=e.reduce((a,x)=>a+Number(x.amount||0),0);return `${shell('Reports','A quick summary of your business activity',`<button class="btn" onclick="exportCSV()">Export sales CSV</button>`)}<div class="stats-grid"><div class="stat-box"><h4>Sales revenue</h4><h5>${fmt(rev)}</h5></div><div class="stat-box"><h4>Expenses</h4><h5>${fmt(cost)}</h5></div><div class="stat-box"><h4>Difference</h4><h5>${fmt(rev-cost)}</h5></div><div class="stat-box"><h4>Products</h4><h5>${productRows().length}</h5></div></div><section class="panel" style="margin-top:18px"><div class="panel-head"><h3>Important note</h3></div><p class="summary-note">These totals are calculated from records saved in this browser. They are not connected to Supabase or shared with other devices in this preview.</p></section>`}
function exportCSV(){let s=allSales(),rows=[['Product','Customer','Quantity','Unit price','Total','Date'],...s.map(x=>[x.product,x.customer,x.quantity,x.unitPrice,x.total,x.date])];let csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='rasho-tech-sales.csv';a.click();URL.revokeObjectURL(a.href);} 
function render(){let c=$('#content');$('#topTitle').textContent=page;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='Dashboard')c.innerHTML=dashboard();else if(page==='Stock')c.innerHTML=stockPage();else if(page==='Reports')c.innerHTML=reports();else c.innerHTML=tablePage(page);let search=$('#search');if(search)search.oninput=e=>{let q=e.target.value.toLowerCase();let arr=load(page),fields=page==='Sales'?[['product','Product'],['customer','Customer'],['quantity','Qty'],['date','Date'],['total','Total']]:page==='Products'?[['name','Product'],['sku','SKU'],['price','Price'],['stock','Stock']]:page==='Customers'?[['name','Name'],['phone','Phone'],['email','Email']]:[['title','Description'],['category','Category'],['date','Date'],['amount','Amount']];$('#rows').innerHTML=renderRows(page,arr.filter(item=>fields.some(([k])=>String(item[k]||'').toLowerCase().includes(q)),fields);}};}
function go(p){page=p;render()}$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});$('#menuToggle').onclick=()=>$('#sidebar').classList.toggle('open');$('#closeModal').onclick=()=>$('#modal').close();$('#closeAuthModal').onclick=closeAuthModal;$('#cancelAuth').onclick=closeAuthModal;$('#authForm').onsubmit=e=>{e.preventDefault();const form=e.target;const email=form.email.value.trim();const password=form.password.value.trim();if(!email||!password){alert('Please enter both your email and password.');return;}const name=(email.split('@')[0]||'User').replace(/[._-]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());setAuthUser({name,email,password});form.reset();closeAuthModal();renderAuthUser();};renderAuthUser();render();
</script>
